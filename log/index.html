<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess</title>
<link rel="icon" id="favicon" href="">
<link rel="stylesheet" href="styles/base.css?v=8fe86391">
<link rel="stylesheet" href="styles/sections.css?v=8fe86391">
<link rel="stylesheet" href="styles/training.css?v=8fe86391">
<link rel="stylesheet" href="styles/play.css?v=8fe86391">
<script src="sync.js?v=8fe86391"></script>
<script>try{if(localStorage.getItem("cc_theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
</head>
<body>
<div class="wrap">
  <!-- AppHeader -->
  <header>
    <h1 class="hlogo">
      <img class="logo" id="logo" alt="">
      Chess
      <span class="me" aria-hidden="true">
        <svg viewBox="0 0 300 50" width="300" height="50">
          <path class="me-p" d="M200 30C150 44 70 46 36 12"/>
          <path class="me-h" d="M36 12l3.5 11.5M36 12l11.5 3.5"/>
        </svg>
        <b>That's me</b>
      </span>
    </h1>
    <button class="themebtn" id="themeBtn" title="Theme">
      <svg viewBox="0 0 24 24">
        <path d="M12 3a9 9 0 1 0 9 9c0-.5 0-1-.1-1.4A5.5 5.5 0 0 1 13.4 3.1 9.3 9.3 0 0 0 12 3z"/>
      </svg>
    </button>
  </header>

  <!-- AppContent: populated by the existing renderer -->
  <div id="app"></div>
</div>
<script src="pieces.js?v=8fe86391"></script>
<script src="data.js?v=8fe86391"></script>
<script src="evals.js?v=8fe86391"></script>
<script>
const ST={done:"Done",active:"In progress",pending:"Pending"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function evalBar(e){
  if(!e)return "";
  let pct,txt;
  if(e.mate!==undefined){pct=e.mate>0?100:0;txt="M"+Math.abs(e.mate)}
  else if(Math.abs(e.cp)>=15000){pct=e.cp>0?100:0;txt="TB"}
  else{pct=50+50*(2/(1+Math.exp(-0.004*e.cp))-1);txt=(Math.abs(e.cp)/100).toFixed(1)}
  const whiteAhead=pct>=50;
  return `<div class="evalbar"><div class="w" style="height:${pct}%"></div><div class="v ${whiteAhead?"bot":"top"}">${txt}</div></div>`;
}
function evalText(e,note){
  if(!e)return "";
  let s;
  if(e.draw)s="Draw";
  else if(e.mate!==undefined)s=(e.mate>0?"White":"Black")+" mates in "+Math.abs(e.mate);
  else if(Math.abs(e.cp)>=15000)s=(e.cp>0?"White":"Black")+" wins (tablebase)";
  else s=(e.cp>=0?"+":"")+(e.cp/100).toFixed(2);
  const tb=e.tb?`<span class="tb">Syzygy: ${e.tb==="draw"?"Draw":e.tb==="win"?"White wins":"Black wins"} (guaranteed)${note?" — "+esc(note):""}</span>`:"";
  return `<div class="evalinfo"><span>${e.depth?`Stockfish: ${s} · depth ${e.depth}`:`Our table: ${s}`}</span>${tb}</div>`;
}
function board(fen,note,flip){
  const rows=fen.split(" ")[0].split("/");
  const g=rows.map(row=>{const a=[];for(const ch of row){if(/\d/.test(ch)){for(let i=0;i<+ch;i++)a.push("")}else a.push(`<img class="pc" src="${PIECES[ch]}" alt="${ch}">`)}return a});
  let h="";
  for(let dr=0;dr<8;dr++)for(let df=0;df<8;df++){const r=flip?7-dr:dr,f=flip?7-df:df;const c=(r+f)%2?"d":"l";let lab="";if(df===0)lab+=`<span class="crd rk">${8-r}</span>`;if(dr===7)lab+=`<span class="crd fl">${"abcdefgh"[f]}</span>`;h+=`<div class="sq ${c}">${g[r][f]}${lab}</div>`}
  const e=(window.EVALS||{})[fen];
  return `<div class="board-wrap${flip?" flip":""}">${evalBar(e)}<div class="board">${h}</div></div>`;
}
function render(L){
  let h="";
  const fmtBig=v=>{if(!/^[\d,]+$/.test(v))return v;const n=Number(v.replace(/,/g,""));if(n<1e6)return v;const e=Math.floor(Math.log10(n));return `${(n/10**e).toFixed(2)} × 10<sup>${e}</sup>`};
  if(L.numbers?.length){
    h+=`<details open><summary><h2>Position Counts</h2></summary><div class="numbers">`+L.numbers.map(n=>`<div class="num"><div class="label">${esc(n.label)}</div><div class="value" title="${/^[\d,]+$/.test(n.value)?n.value:""}">${fmtBig(n.value)}</div>${n.pct?`<div class="pct">${n.pct}</div>`:""}${n.note?`<div class="note">${n.note}</div>`:""}</div>`).join("")+`</div></details>`;
  }
  if(L.phases?.length){
    h+=`<details><summary><h2>Phases <span class="cnt">(${L.phases.length})</span></h2></summary><ol class="phases">`+L.phases.map(p=>`<li class="phase ${p.status}"><div class="n">${p.n}</div><div><div class="t">${esc(p.title)}</div>${p.note?`<div class="d">${esc(p.note)}</div>`:""}</div></li>`).join("")+`</ol></details>`;
  }
  if(L.rules?.length){
    const done=L.rules.filter(r=>r.status!=="pending").length, pend=L.rules.length-done;
    const cnt=pend?`(${done} done · ${pend} pending)`:`(${done})`;
    h+=`<details><summary><h2>Space Rules <span class="cnt">${cnt}</span></h2></summary><div class="tscroll"><table><thead><tr><th>#</th><th>Rule</th><th>Why it is guaranteed</th><th>Impact</th></tr></thead><tbody>`+L.rules.map((r,i)=>{
      const p=r.status==="pending";
      return `<tr class="${p?"pend":""}"><td>${i+1}</td><td>${esc(r.rule)}</td><td>${esc(r.why||"")}</td><td>${p?`<span class="pbadge">Pending</span>${r.est?`<div class="est">${esc(r.est)}</div>`:""}`:r.impact}</td></tr>`;
    }).join("")+`</tbody></table></div></details>`;
  }
  const pcs=str=>[...(str||"")].map(c=>`<span class="egp"><img class="egpc" src="${PIECES[c]}" alt="${c}"><i>${c.toUpperCase()}</i></span>`).join("");
  const egCell=r=>r.white?`<div class="eg"><span class="side w">${pcs(r.white)}</span><span class="vs">vs</span><span class="side b">${pcs(r.black)}</span></div>`:esc(r.endgame);
  const MS=new Set(L.mastered||[]);const M=k=>MS.has(k);const DN=k=>M(k)?" done":"";const IP=new Set(L.inProgress||[]);const CK=k=>M(k)?`<span class="ck">✓</span>`:IP.has(k)?`<span class="ip"></span>`:"";const CNT=a=>{const d=a.filter(M).length;return ` <span class="cnt">(${d}/${a.length} ✓)</span>`};
  const SK=nm=>{const k=(L.sections||[]).filter(s=>s.stage===nm).flatMap(s=>s.items.map(x=>Array.isArray(x)?x[s.type==="gambit"||s.type==="rep"?1:0]:x));if(nm==="Middlegame")k.push(...[...(L.middlegame||[]),...(L.middlegameExtra||[])].map(r=>r.tactic));if(nm==="Endgame")k.push(...L.strategy.flatMap(g=>g.items.filter(r=>r.status!=="pending").map(r=>r.endgame)));return k};
  const secs=(nm,late)=>(L.sections||[]).filter(s=>s.stage===nm&&(s.type==="gambit")===!!late).map(s=>`<div class="stagebody secb">${s.title?`<h4 class="sub">${esc(s.title)}${s.stage==="Pieces"?"":CNT(s.items.map(x=>Array.isArray(x)?x[s.type==="gambit"||s.type==="rep"?1:0]:x))}</h4>`:""}${s.type==="gambit"||s.type==="rep"?`<div class="tcards">${s.items.map(([sd,n,mv,f],i)=>`<div class="tcard${DN(n)}"><div class="tch"><b><span class="tcn">${i+1}.</span> ${esc(n)}</b>${CK(n)}</div><div class="tdesc">${s.type==="gambit"?`${sd} gambit · `:""}${esc(mv)}</div><div class="tcb">${exCell(f,sd==="Black")}</div></div>`).join("")}</div>`:s.type==="ex"?`<div class="tcards">${s.items.map(([n,d,f,k],i)=>`<div class="tcard${DN(n)}"><div class="tch"><b><span class="tcn">${i+1}.</span> ${esc(n)}</b>${CK(n)}</div><div class="tdesc">${esc(d)}</div><div class="tcb">${exCell(f)}</div><div class="tdesc">${f.split(" ")[1]==="w"?"White":"Black"} to move · ${esc(k)}</div></div>`).join("")}</div>`:s.type==="chips"?`<div class="chips">${s.items.map(([n,u],i)=>u?`<a class="chip olink${DN(n)}" target="_blank" href="${u}">${i+1}. ${esc(n)}${CK(n)}</a>`:`<span class="chip${DN(n)}">${i+1}. ${esc(n)}${CK(n)}</span>`).join("")}</div>`:s.type==="ol"?`<ol class="rsteps tsteps">${s.items.map(([n,d,f,k])=>`<li class="${DN(n)}"><b>${esc(n)}${CK(n)}</b><span>${esc(d)}${f?`<span class="stepex"><span class="tcb">${exCell(f)}</span><span class="tdesc">${esc(k)}</span></span>`:""}</span></li>`).join("")}</ol>`:(()=>{const l=`<ol class="plist">${s.items.map(x=>`<li class="${DN(x)}">${esc(x)}${CK(x)}</li>`).join("")}</ol>`;return s.fen?`<div class="pwrap">${l}<div class="pboard">${board(s.fen)}</div></div>`:l})()}</div>`).join("");
  const exCell=(fen,flip)=>{if(flip===undefined)flip=fen.split(" ")[1]==="b";const e=(window.EVALS||{})[fen]||{};const t=e.draw?"Draw":e.mate!==undefined?`${e.mate>0?"White":"Black"} mates in ${Math.abs(e.mate)}`:"";return `<a class="ex" href="https://www.chess.com/analysis?fen=${encodeURIComponent(fen)}" target="_blank" rel="noopener" title="Analyze on Chess.com">${board(fen,"",flip)}${t?`<div class="turn ${e.draw?"draw":e.mate>0?"win":"loss"}">${t}</div>`:""}</a>`};
  const RORD={"White wins":0,"Black wins":0,"Depends":1,"Draw":2,"White loses":3,"Black loses":3};
  const stTag=st=>st==="proven"?`<span class="stag ok">✓ Solved</span>`:st==="pending"?`<span class="stag pend">Pending</span>`:`<span class="stag wip">In progress</span>`;
  const ruleCell=x=>typeof x==="string"?esc(x):`<div class="rt">${esc(x.title)}</div><ol class="rsteps">${x.steps.map(([n,d])=>`<li><b>${esc(n)}</b><span>${/<(br|a )/.test(d)?d.replace(/(^|<br>)White:/g,`$1<img class="rpc" src="${PIECES.K}" alt="">White:`).replace(/(^|<br>)Black:/g,`$1<img class="rpc" src="${PIECES.k}" alt="">Black:`):esc(d)}</span></li>`).join("")}</ol>${x.always?.length?`<div class="ralw"><div class="ralh">Always</div><ul>${x.always.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div>`:""}`;
  const research=h;h="";
  if(L.strategy?.length){
    h+=`<div class="strwrap">`+[["Pieces",[]],["Thinking Process",[]],["Opening",L.opening||[]],["Middlegame",L.middlegame||[]]].map(([nm,its])=>`<details ${nm==="Thinking Process"?"open":""} class="stage"><summary><h3 class="stg">${nm}${nm==="Pieces"?"":CNT(SK(nm))}${(()=>{const t=nm==="Middlegame"?L.middlegameTotal:nm==="Opening"?L.openingTotal:"";return t?`<span class="lvltot">${t}</span>`:""})()}</h3></summary>${(()=>{const nt=(nm==="Opening"?L.openingNotes:nm==="Middlegame"?L.middlegameNotes:[])||[];return nt.length?`<div class="stagebody"><ul class="stnotes">${nt.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""})()}${secs(nm)}${nm==="Middlegame"?`<div class="stagebody"><h4 class="sub">Tactics${CNT([...its,...(L.middlegameExtra||[])].map(r=>r.tactic))}</h4><div class="chips">${[...its,...(L.middlegameExtra||[])].map((r,i)=>`<a class="chip olink${DN(r.tactic)}" target="_blank" rel="noopener" href="${r.link||"https://lichess.org/training"}">${i+1}. ${esc(r.tactic)}${CK(r.tactic)}</a>`).join("")}</div></div>`:""}${secs(nm,1)}</details>`).join("")+`<details class="stage"><summary><h3 class="stg">Endgame${CNT(SK("Endgame"))}${L.endgameTotal?`<span class="lvltot">${L.endgameTotal}</span>`:""}</h3></summary><div class="stagebody">${(L.endgameNotes||[]).length?`<ul class="stnotes">${L.endgameNotes.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}${secs("Endgame")}`+L.strategy.map(g=>`${(()=>{const ks=g.items.filter(r=>r.status!=="pending").map(r=>r.endgame);g._ks=ks;g._all=ks.length&&ks.every(M);return ""})()}<details class="lvlbox${g.items.length?"":" empty"}${g._all?" done":""}"><summary><h3 class="lvl">${esc(g.level)}${g._all?`<span class="ck">✓</span>`:""} ${g._ks.length?CNT(g._ks).trim():`<span class="cnt">(${g.items.length})</span>`}${(()=>{const left=g.items.filter(i=>i.status!=="proven").length;return !g.items.length?`<span class="stag pend">Pending</span>`:left?`<span class="stag wip">${left} left</span>`:`<span class="stag ok">✓ Solved</span>`})()}${g.total?`<span class="lvltot">${esc(g.total)}</span>`:""}</h3></summary><div class="tscroll"><table class="strat"><colgroup><col style="width:16%"><col style="width:19%"><col style="width:39%"><col style="width:26%"></colgroup><thead><tr><th>Endgame</th><th>Example</th><th>Rule</th><th>Coverage</th></tr></thead><tbody>`+[...g.items].sort((x,y)=>(RORD[x.result]??9)-(RORD[y.result]??9)).map(r=>{
      const p=r.status!=="proven";
      return `<tr class="${DN(r.endgame)}"><td style="white-space:nowrap">${egCell(r)}${CK(r.endgame)}<div class="stagw">${stTag(r.status)}</div></td><td>${(r.examples||[]).map(f=>exCell(f)).join("")}</td><td>${ruleCell(r.rule)}</td><td>${r.coverage||`<span class="pbadge">${r.status==="proposed"?"Proposed":"Pending"}</span>`}</td></tr>`;
    }).join("")+`</tbody></table></div></details>`).join("")+`</div></details></div>`;
  }

  document.getElementById("logo").src=PIECES.P;{const sh=()=>{const hd=document.querySelector("header"),tb=document.querySelector(".tabs"),r=document.documentElement.style;if(hd)r.setProperty("--hh",hd.offsetHeight+"px");if(tb)r.setProperty("--th",tb.offsetHeight+"px")};sh();addEventListener("resize",sh);addEventListener("load",sh)}document.getElementById("themeBtn").addEventListener("click",()=>{const d=document.documentElement,dk=d.dataset.theme!=="dark";if(dk)d.dataset.theme="dark";else delete d.dataset.theme;try{localStorage.setItem("cc_theme",dk?"dark":"purple")}catch(e){}});document.getElementById("favicon").href=PIECES.P;let tab="training";try{tab=localStorage.getItem("cc_tab")||"training"}catch(e){}
  document.getElementById("app").innerHTML=`<nav class="tabs">${(()=>{const k=[...new Set(["Thinking Process","Opening","Middlegame","Endgame"].flatMap(SK))];const d=k.filter(M).length,pc=Math.round(d/k.length*1000)/10,ip=k.filter(x=>!M(x)&&IP.has(x)).length,pq=Math.round((d+ip)/k.length*1000)/10;return `<button data-t="training" class="tprog" style="--p:${pc}%;--q:${pq}%">Training<span class="tcnt">${d}/${k.length} · ${pc}%${ip?` · ${ip} in progress`:""}</span></button>`})()}<button data-t="research">Research</button><button data-t="play">Play</button></nav><div class="tabpane" data-t="training"><div class="daily goals"><b>Goals</b><span class="gnext"><span class="gs">1 Oct 2026<i>→</i><strong>1 Oct 2027</strong></span><u></u><span class="gs"><em>FIDE</em>0<i>→</i><strong>1800</strong></span><u></u><span class="gs"><em>Online</em>1600<i>→</i><strong>2600</strong></span></span></div><div class="daily goals"><b>Big goals</b><span>World #1</span><span>Beat the engine</span><span>Solve chess</span></div><div class="daily"><b>Daily</b><span>3 rapid games (10+5 or 15+10)</span><span>Analyze at least 1 of them</span><span>10 puzzles minimum</span><span>2 items from Training</span></div>${h}</div><div class="tabpane" data-t="research">${research}</div><div class="tabpane" data-t="play"><div class="play" id="play"></div></div>`;
  const setTab=t=>{document.querySelectorAll(".tabs button,.tabpane").forEach(x=>x.classList.toggle("on",x.dataset.t===t));try{localStorage.setItem("cc_tab",t)}catch(e){}};
  document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.t)));
  setTab(tab);
  (()=>{const t=new Date(),day=`${t.getFullYear()}-${t.getMonth()+1}-${t.getDate()}`;let st={};try{const o=JSON.parse(localStorage.getItem("cc_daily")||"{}");st=o.day===day?o.done||{}:{}}catch(e){}
  const save=()=>{try{localStorage.setItem("cc_daily",JSON.stringify({day,done:st}))}catch(e){}};
  document.querySelectorAll(".daily span").forEach((el,i)=>{el.classList.toggle("done",!!st[i]);el.addEventListener("click",()=>{st[i]=!st[i];if(!st[i])delete st[i];el.classList.toggle("done",!!st[i]);save()})})})();
}
render(window.LOG);
</script>
<script src="lib/chess.min.js"></script>
<script src="lib/openings.js"></script>
<script src="play.js?v=8fe86391"></script>
</body>
</html>
